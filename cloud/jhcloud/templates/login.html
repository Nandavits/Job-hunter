{% extends "base.html" %}{% block title %}Log in · Job Hunter{% endblock %}
{% block body %}<div class="card narrow"><h1>Log in</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/login"><label>Email</label><input name="email" type="email" value="{{ email or '' }}" required autocomplete="username">
<label>Password</label><input name="password" type="password" required autocomplete="current-password">
<p><button>Log in</button></p></form>
<p class="muted">No account yet? <a href="/signup">Sign up</a></p></div>{% endblock %}
