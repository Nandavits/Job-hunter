{% extends "base.html" %}{% block title %}New password · Job Hunter{% endblock %}
{% block body %}<div class="card narrow"><h1>Choose a new password</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
{% if token %}<form method="post" action="/reset"><input type="hidden" name="token" value="{{ token }}">
<label>New password (at least 10 characters)</label><input name="password" type="password" minlength="10" required autocomplete="new-password">
<p><button>Save new password</button></p></form>{% else %}<p><a href="/forgot">Ask for a new link</a></p>{% endif %}</div>{% endblock %}
