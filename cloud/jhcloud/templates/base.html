<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Hunter{% endblock %}</title>
<style>
:root{--bg:#0b0b0c;--panel:#151517;--line:#2a2a2e;--text:#f2f2f2;--muted:#a3a3a8;--gold:#d4af37;--gold2:#f1d27a;--bad:#e5766d;--good:#7cc49a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--gold2);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.04em;color:var(--gold)}nav a{margin-left:18px;color:var(--text)}
main{max-width:1040px;margin:0 auto;padding:28px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1{font-size:24px;margin:0 0 16px}h2{font-size:18px;margin:0 0 10px}
input,textarea,select{width:100%;background:#0f0f11;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
textarea{font-family:ui-monospace,Consolas,monospace;font-size:13px;min-height:320px}
button,.btn{display:inline-block;background:var(--gold);color:#111;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
button.ghost{background:none;color:var(--text);border:1px solid var(--line)}
label{display:block;margin:12px 0 6px;color:var(--muted)}
.error{background:#2a1513;border:1px solid #5a2a26;color:#f4c2bd;padding:10px 12px;border-radius:8px;margin-bottom:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:13px}
.score{font-weight:700;color:var(--gold2)}.muted{color:var(--muted);font-size:13px}
.tabs a{margin-right:14px;color:var(--muted)}.tabs a.on{color:var(--gold2);font-weight:600}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.narrow{max-width:420px;margin:40px auto}
pre.ad{white-space:pre-wrap;font:inherit;max-height:420px;overflow:auto;background:#0f0f11;padding:14px;border-radius:8px;border:1px solid var(--line)}
</style>
</head>
<body>
<header><span class="brand">JOB HUNTER</span>
{% if user %}<nav><a href="/jobs">Jobs</a><a href="/settings">Settings</a>
<form method="post" action="/logout" style="display:inline"><button class="ghost" style="margin-left:18px">Log out</button></form></nav>{% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
