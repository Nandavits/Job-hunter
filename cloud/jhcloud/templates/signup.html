{% extends "base.html" %}{% block title %}Sign up · Job Hunter{% endblock %}
{% block body %}<div class="card narrow"><h1>Create your account</h1>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/signup"><label>Email</label><input name="email" type="email" value="{{ email or '' }}" required autocomplete="username">
<label>Password (at least 10 characters)</label><input name="password" type="password" minlength="10" required autocomplete="new-password">
<p><button>Sign up</button></p></form>
<p class="muted">Already have an account? <a href="/login">Log in</a></p></div>{% endblock %}
