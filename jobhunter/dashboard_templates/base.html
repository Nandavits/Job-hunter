<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Hunter{% endblock %}</title>
<style>
:root{--bg:#0b0b0c;--panel:#151517;--line:#2a2a2e;--text:#f2f2f2;--muted:#a3a3a8;--gold:#d4af37;--gold2:#f1d27a;--bad:#e5766d;--good:#7cc49a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--gold2);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;align-items:center;gap:24px;padding:12px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
.brand{font-weight:700;letter-spacing:.05em;color:var(--gold)}nav a{color:var(--text);margin-right:16px}nav a.on{color:var(--gold2);font-weight:600}
main{max-width:1240px;margin:0 auto;padding:22px 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h1{font-size:22px;margin:0 0 14px}h2{font-size:16px;margin:0 0 10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.score{font-weight:700;color:var(--gold2);font-size:16px}.muted{color:var(--muted);font-size:12.5px}
.must{color:var(--bad);font-weight:600}
input,select{background:#0f0f11;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit}
button,.btn{display:inline-block;background:var(--gold);color:#111;border:0;border-radius:7px;padding:7px 12px;font-weight:600;cursor:pointer;font:inherit;font-weight:600}
button.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{display:inline-block;padding:1px 8px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}.tile b{display:block;font-size:26px;color:var(--gold2)}
.chart{width:100%;max-width:760px}.chart .bar{fill:var(--gold)}.chart .lbl{fill:var(--muted);font-size:12px}.chart .val{fill:var(--text);font-size:12px}
pre.ad{white-space:pre-wrap;font:inherit;max-height:460px;overflow:auto;background:#0f0f11;padding:14px;border-radius:8px;border:1px solid var(--line)}
.note{background:#1d1a10;border:1px solid #4a3f17;padding:10px 12px;border-radius:8px;margin:10px 0}
</style></head><body>
<header><span class="brand">JOB HUNTER</span>
<nav><a href="/" class="{{ 'on' if page=='jobs' }}">Jobs ({{ open_count }})</a><a href="/tracker" class="{{ 'on' if page=='tracker' }}">Applications ({{ applied_count }})</a><a href="/charts" class="{{ 'on' if page=='charts' }}">Charts</a></nav>
<span class="muted" style="margin-left:auto">Only on this computer · Job Hunter never submits for you</span></header>
<main>{% block body %}{% endblock %}</main></body></html>
