<html><body><h1>Data Engineer</h1>
<form id="f" action="/submit" method="post" onsubmit="window.SUBMITTED=true; document.title='SUBMITTED'; return false;">
<label for="first_name">First Name *</label><input id="first_name" required>
<label for="last_name">Last Name *</label><input id="last_name" required>
<label for="email">Email *</label><input id="email" type="email" required>
<label for="phone">Phone</label><input id="phone" type="tel">
<label for="resume">Resume/CV *</label><input id="resume" type="file" required>
<label for="cover_letter">Cover Letter</label><input id="cover_letter" type="file">
<label for="q1">LinkedIn Profile</label><input id="q1">
<label for="q2">Website</label><input id="q2">
<label for="q3">What are your salary expectations? *</label><input id="q3" required>
<label for="q4">Are you legally authorized to work in Germany? *</label><select id="q4" required><option></option><option>Yes</option><option>No</option></select>
<label for="q5">Why do you want to join us? *</label><textarea id="q5" required></textarea>
<fieldset><legend>Will you now or in the future require visa sponsorship? *</legend>
<label><input type="radio" name="sponsor" value="1" required> Yes</label>
<label><input type="radio" name="sponsor" value="0"> No</label></fieldset>
<label for="country">Country of residence</label><select id="country"><option>Please select</option><option>Austria</option><option>Germany</option><option>Switzerland</option></select>
<label for="gender">Gender (voluntary)</label><select id="gender"><option>Select...</option><option>Male</option><option>Female</option><option>Non-binary</option><option>I prefer not to say</option></select>
<label for="hear">How did you hear about us?</label><select id="hear"><option>--</option><option>LinkedIn</option><option>Company website</option><option>Friend</option></select>
<label for="ethn">Ethnicity</label><select id="ethn"><option>Select</option><option>Asian</option><option>White</option></select>
<label><input type="checkbox" id="consent" required> I agree to the privacy policy *</label>
<button type="submit">Submit application</button>
</form></body></html>
