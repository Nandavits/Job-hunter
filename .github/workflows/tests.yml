name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-hands.txt icalendar recurring-ical-events httpx
      # Jako's voice-message model (faster-whisper) is large and not needed for the tests
      - run: pytest -q
