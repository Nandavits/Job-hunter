services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    ports:
      - "127.0.0.1:5433:5432"   # only this computer: lets apply.bat read the job list
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  jobhunter:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobhunter:jobhunter@db:5432/jobhunter
      TZ: Europe/Berlin
    volumes:
      - ./config:/app/config
      - ./jobhunter:/app/jobhunter   # code changes apply without a rebuild
      - ./data:/app/data
      - ./output:/app/output
      - ./.env:/app/.env:ro            # keys/passwords: changes apply at the next run, no restart
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped


  jako:
    build:
      context: .
      dockerfile: Dockerfile.jako
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobhunter:jobhunter@db:5432/jobhunter
      TZ: Europe/Berlin
    ports:
      - "127.0.0.1:8765:8765"        # Jako's page: only this computer
    volumes:
      - ./jako:/app/jako
      - ./jobhunter:/app/jobhunter
      - ./data:/app/data
      - ./.env:/app/.env:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
