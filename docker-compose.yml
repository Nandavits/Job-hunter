services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobhunter
      POSTGRES_PASSWORD: jobhunter
      POSTGRES_DB: jobhunter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobhunter"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  jobhunter:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://jobhunter:jobhunter@db:5432/jobhunter
      TZ: Europe/Berlin
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./output:/app/output
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
