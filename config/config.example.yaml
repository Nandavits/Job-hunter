# Job Hunter configuration. Copy to config/config.yaml and adjust.

search:
  # Job titles you want. A job must match at least one (case-insensitive) in its title.
  title_keywords:
    - data engineer
    - analytics engineer
    - data analyst
    - bi analyst
    - bi engineer
    - business intelligence
    - bi developer
    - etl developer
    - data platform
    - automation engineer
    - ai engineer
    - data operations
    - dataops
    - datenanalyst
    - dateningenieur
    - bi-entwickler

  # Titles containing any of these are dropped.
  exclude_title_keywords:
    - senior
    - sr.
    - sr
    - snr
    - lead
    - principal
    - staff
    - head of
    - director
    - manager
    - intern
    - internship
    - praktikum
    - werkstudent
    - working student
    - ausbildung

  # true = any city in Germany (jobs abroad are still dropped). false = only the places below.
  anywhere_in_germany: true

  # Where you can work. "remote" matches remote / home office postings.
  locations:
    - berlin
    - remote
    - germany
    - deutschland

  # A repost of a role you applied to within this many days is skipped.
  reapply_after_days: 180

  # Drop jobs that ask for more years of experience than this (whole number, e.g. 2).
  # "3-5 years" counts as 3, "2+ years" as 2. Ads that don't say are kept.
  max_years_experience: 3

  # Other countries you would also work in, besides Germany. Empty = Germany only.
  # Known: india, austria, switzerland, netherlands, united kingdom, ireland, france, spain,
  #        portugal, poland, usa, canada, uae, singapore.   Example:  also_countries: [india]
  also_countries: []

  # Your German level: A1, A2, B1, B2, C1, C2. Jobs that clearly require a higher level are dropped.
  german_level: A2

  # Skills used for scoring (higher weight = more important to you).
  skills:
    sql: 3
    dbt: 3
    airflow: 3
    docker: 2
    postgres: 2
    python: 2
    n8n: 2
    etl: 2
    elt: 1
    superset: 1
    metabase: 1
    power bi: 1
    tableau: 1
    data quality: 1
    data modelling: 1
    data modeling: 1

  # Match score 0-100 (how well you fit what the job asks for). Jobs below this are skipped.
  # Roughly: 85+ excellent, 70-84 good, 55-69 worth a look.
  min_score: 55

  # true = only keep jobs whose ad text could be read, so skills and experience are really checked.
  # false = also keep jobs from alert emails whose ad could not be opened (shown with a low score).
  skip_jobs_without_ad_text: false

sources:
  # Arbeitnow (arbeitnow.com): free public API, Germany, many English-speaking jobs.
  arbeitnow:
    enabled: true
    max_pages: 5

  # Data Berlin (databerlin.net): ~1,000 Berlin data & AI jobs from company career pages, with the
  # employer's own application link. Job pages are read only for titles that fit your roles.
  # Amazon (amazon.jobs): jobs in Germany from Amazon's own careers search.
  amazon:
    enabled: true

  databerlin:
    enabled: true
    max_details: 80

  # Bundesagentur für Arbeit (Germany's federal job board, public API, covers many boards).
  arbeitsagentur:
    enabled: true
    queries:
      - Data Engineer
      - Analytics Engineer
      - Data Analyst
      - BI Analyst
      - Datenanalyst
      - Dateningenieur
      - BI-Entwickler
      - ETL-Entwickler
    where: ""          # empty = all of Germany; or a city, e.g. Berlin
    radius_km: 30      # only used when "where" is a city
    published_since_days: 7
    include_remote: true

  # Company career pages via official public ATS APIs.
  # Find a company's ATS + slug with:  python -m jobhunter discover <careers-page-url>
  # The entries below are examples — run `python -m jobhunter check-sources` to verify them.
  companies:
    # Also supported: {name: Bosch, ats: smartrecruiters, slug: BoschGroup} and
    # {name: X, ats: workday, host: x.wd3.myworkdayjobs.com, tenant: x, site: X_Careers}
    - {name: Talon.One, ats: greenhouse, slug: linkedinjobs}
    - {name: Contentful, ats: greenhouse, slug: contentful}
    - {name: HelloFresh, ats: greenhouse, slug: hellofresh}
    - {name: N26, ats: greenhouse, slug: n26}
    - {name: 1KOMMA5°, ats: personio, slug: 1komma5grad}
    - {name: GetYourGuide, ats: greenhouse, slug: getyourguide}
    - {name: SumUp, ats: greenhouse, slug: sumup}
    - {name: Celonis, ats: greenhouse, slug: celonis}
    - {name: Raisin, ats: greenhouse, slug: raisin}
    - {name: Trade Republic, ats: greenhouse, slug: traderepublicbank}
    - {name: Solaris, ats: greenhouse, slug: solarisbank}
    - {name: Moss, ats: ashby, slug: moss}
    - {name: Enpal, ats: ashby, slug: enpal}
    - {name: Flinn, ats: ashby, slug: flinn}
    - {name: Parloa, ats: ashby, slug: parloa}
    - {name: Upvest, ats: ashby, slug: upvest}
    - {name: Choco, ats: ashby, slug: choco}
    - {name: Mobimeo, ats: personio, slug: mobimeo}
    - {name: Ada Health, ats: greenhouse, slug: adahealth}
    - {name: Spotify, ats: lever, slug: spotify}

  # Job-alert emails from LinkedIn, StepStone, Indeed, XING, etc. (read-only, via Gmail IMAP).
  # Set up job alerts on those sites first; this only reads the emails they send you.
  email_alerts:
    enabled: false
    imap_host: imap.gmail.com
    folder: INBOX
    days_back: 2
    senders:
      - jobalerts-noreply@linkedin.com
      - jobs-listings@linkedin.com
      - jobagent.stepstone.de
      - indeed
      - mail.xing.com
      - glassdoor.com
      # Job boards: set up a job alert / Jobmail on each site with this Gmail address
      - jobvector            # jobvector.de (Jobmail)
      - yourfirm             # yourfirm.de (Job-Alarm)
      - jobware              # jobware.de (Jobagent)
      - goodjobs             # goodjobs.eu (Job-Alert)
      - kimeta               # kimeta.de (Job-Alarm)
      - empfehlungsbund      # empfehlungsbund.de and its portals (E-Mail-Jobabo)
      - interamt             # interamt.de, public sector (Suchagent)
      - karriere-familienunternehmen   # karriere-familienunternehmen.de
      - entrepreneursclub    # karriere-familienunternehmen.de sends its alerts from entrepreneursclub.eu
      - joblift              # joblift.de (Job-Alarm)
      - arbeitnow            # arbeitnow.com alerts (its public API is read as well)

tailoring:
  # How many top new jobs get a tailored CV + cover letter each run.
  top_n: 5
  # Make PDFs with LibreOffice (if installed) in addition to .docx
  make_pdf: true

digest:
  email: true        # send the daily digest to GMAIL_ADDRESS
  attach_documents: false   # true = attach the tailored CVs and cover letters to the email
  telegram: false

schedule:
  every_minutes: 30   # check for new jobs every 30 minutes while the computer is on
  daily_at: "08:00"   # used only if every_minutes is removed
